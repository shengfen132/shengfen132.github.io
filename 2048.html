<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048 - 游戏中心</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-2048-container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .game-2048-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
    }
    .score-container {
      display: flex;
      gap: 16px;
    }
    .score-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid var(--glass);
      border-radius: 8px;
      padding: 12px 20px;
      min-width: 80px;
    }
    .score-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .score-value {
      font-size: 24px;
      font-weight: 700;
      color: #22c55e;
    }
    .grid-container {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 2px solid var(--glass);
      border-radius: 12px;
      padding: 10px;
      margin: 20px auto;
      width: fit-content;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-template-rows: repeat(4, 100px);
      gap: 10px;
      position: relative;
    }
    .cell {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
    }
    .tile {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      border-radius: 8px;
      transition: all 0.15s ease-in-out;
      width: 100px;
      height: 100px;
    }
    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 28px; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 28px; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 28px; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 24px; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 24px; }
    .tile-4096 { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
    .tile-8192 { background: #3c3a32; color: #f9f6f2; font-size: 20px; }
    .tile-new {
      animation: appear 0.2s ease;
    }
    @keyframes appear {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(238, 228, 218, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .game-over-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .game-over-message {
      font-size: 48px;
      font-weight: 700;
      color: #776e65;
      margin-bottom: 20px;
    }
    @media (max-width: 520px) {
      .grid {
        grid-template-columns: repeat(4, 70px);
        grid-template-rows: repeat(4, 70px);
      }
      .tile {
        width: 70px;
        height: 70px;
        font-size: 24px;
      }
      .tile-128, .tile-256, .tile-512 { font-size: 20px; }
      .tile-1024, .tile-2048 { font-size: 18px; }
      .tile-4096, .tile-8192 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="game-2048-container">
      <a href="index.html" class="back-link">🏠 返回游戏中心</a>
      <h1>🎲 2048</h1>
      
      <div class="game-2048-header">
        <div class="score-container">
          <div class="score-box">
            <div class="score-label">分数</div>
            <div class="score-value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">最高</div>
            <div class="score-value" id="bestScore">0</div>
          </div>
        </div>
      </div>
      
      <div class="grid-container">
        <div class="grid" id="grid">
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="cell"></div>
          <div class="game-over-overlay" id="gameOverOverlay">
            <div class="game-over-message">游戏结束</div>
          </div>
        </div>
      </div>
      
      <div class="controls">
        <button id="newGameBtn">新游戏</button>
      </div>
      
      <p class="hint">使用方向键或滑动屏幕来移动方块，相同数字的方块会合并！</p>
    </div>
  </main>
  
  <script>
    class Game2048 {
      constructor() {
        this.size = 4;
        this.grid = [];
        this.score = 0;
        this.bestScore = parseInt(localStorage.getItem('2048-best') || '0');
        this.gameOver = false;
        
        this.gridElement = document.getElementById('grid');
        this.scoreElement = document.getElementById('score');
        this.bestScoreElement = document.getElementById('bestScore');
        this.gameOverOverlay = document.getElementById('gameOverOverlay');
        
        this.init();
        this.setupInput();
      }
      
      init() {
        this.grid = Array(this.size).fill(null).map(() => Array(this.size).fill(0));
        this.score = 0;
        this.gameOver = false;
        this.addNewTile();
        this.addNewTile();
        this.render();
        this.updateScore();
      }
      
      addNewTile() {
        const emptyCells = [];
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.grid[r][c] === 0) {
              emptyCells.push({ r, c });
            }
          }
        }
        
        if (emptyCells.length > 0) {
          const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
          this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
          return true;
        }
        return false;
      }
      
      move(direction) {
        if (this.gameOver) return;
        
        let moved = false;
        const oldGrid = this.grid.map(row => [...row]);
        
        if (direction === 'left') {
          moved = this.moveLeft();
        } else if (direction === 'right') {
          moved = this.moveRight();
        } else if (direction === 'up') {
          moved = this.moveUp();
        } else if (direction === 'down') {
          moved = this.moveDown();
        }
        
        if (moved) {
          this.addNewTile();
          this.render();
          this.updateScore();
          
          if (this.isGameOver()) {
            this.gameOver = true;
            this.gameOverOverlay.classList.add('show');
          }
        }
      }
      
      moveLeft() {
        let moved = false;
        for (let r = 0; r < this.size; r++) {
          const row = this.grid[r].filter(val => val !== 0);
          const newRow = [];
          
          for (let i = 0; i < row.length; i++) {
            if (i < row.length - 1 && row[i] === row[i + 1]) {
              newRow.push(row[i] * 2);
              this.score += row[i] * 2;
              i++;
            } else {
              newRow.push(row[i]);
            }
          }
          
          while (newRow.length < this.size) {
            newRow.push(0);
          }
          
          for (let c = 0; c < this.size; c++) {
            if (this.grid[r][c] !== newRow[c]) {
              moved = true;
            }
            this.grid[r][c] = newRow[c];
          }
        }
        return moved;
      }
      
      moveRight() {
        let moved = false;
        for (let r = 0; r < this.size; r++) {
          const row = this.grid[r].filter(val => val !== 0);
          const newRow = [];
          
          for (let i = row.length - 1; i >= 0; i--) {
            if (i > 0 && row[i] === row[i - 1]) {
              newRow.unshift(row[i] * 2);
              this.score += row[i] * 2;
              i--;
            } else {
              newRow.unshift(row[i]);
            }
          }
          
          while (newRow.length < this.size) {
            newRow.unshift(0);
          }
          
          for (let c = 0; c < this.size; c++) {
            if (this.grid[r][c] !== newRow[c]) {
              moved = true;
            }
            this.grid[r][c] = newRow[c];
          }
        }
        return moved;
      }
      
      moveUp() {
        let moved = false;
        for (let c = 0; c < this.size; c++) {
          const col = [];
          for (let r = 0; r < this.size; r++) {
            if (this.grid[r][c] !== 0) {
              col.push(this.grid[r][c]);
            }
          }
          
          const newCol = [];
          for (let i = 0; i < col.length; i++) {
            if (i < col.length - 1 && col[i] === col[i + 1]) {
              newCol.push(col[i] * 2);
              this.score += col[i] * 2;
              i++;
            } else {
              newCol.push(col[i]);
            }
          }
          
          while (newCol.length < this.size) {
            newCol.push(0);
          }
          
          for (let r = 0; r < this.size; r++) {
            if (this.grid[r][c] !== newCol[r]) {
              moved = true;
            }
            this.grid[r][c] = newCol[r];
          }
        }
        return moved;
      }
      
      moveDown() {
        let moved = false;
        for (let c = 0; c < this.size; c++) {
          const col = [];
          for (let r = 0; r < this.size; r++) {
            if (this.grid[r][c] !== 0) {
              col.push(this.grid[r][c]);
            }
          }
          
          const newCol = [];
          for (let i = col.length - 1; i >= 0; i--) {
            if (i > 0 && col[i] === col[i - 1]) {
              newCol.unshift(col[i] * 2);
              this.score += col[i] * 2;
              i--;
            } else {
              newCol.unshift(col[i]);
            }
          }
          
          while (newCol.length < this.size) {
            newCol.unshift(0);
          }
          
          for (let r = 0; r < this.size; r++) {
            if (this.grid[r][c] !== newCol[r]) {
              moved = true;
            }
            this.grid[r][c] = newCol[r];
          }
        }
        return moved;
      }
      
      isGameOver() {
        // Check if there are any empty cells
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            if (this.grid[r][c] === 0) return false;
          }
        }
        
        // Check if any adjacent cells can be merged
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            const current = this.grid[r][c];
            if ((r < this.size - 1 && this.grid[r + 1][c] === current) ||
                (c < this.size - 1 && this.grid[r][c + 1] === current)) {
              return false;
            }
          }
        }
        
        return true;
      }
      
      render() {
        // Remove old tiles
        const oldTiles = this.gridElement.querySelectorAll('.tile');
        oldTiles.forEach(tile => tile.remove());
        
        // Add new tiles
        for (let r = 0; r < this.size; r++) {
          for (let c = 0; c < this.size; c++) {
            const value = this.grid[r][c];
            if (value !== 0) {
              const tile = document.createElement('div');
              tile.className = `tile tile-${value}`;
              tile.textContent = value;
              tile.style.transform = `translate(${c * 110}px, ${r * 110}px)`;
              this.gridElement.appendChild(tile);
            }
          }
        }
      }
      
      updateScore() {
        this.scoreElement.textContent = this.score;
        if (this.score > this.bestScore) {
          this.bestScore = this.score;
          localStorage.setItem('2048-best', this.bestScore);
        }
        this.bestScoreElement.textContent = this.bestScore;
      }
      
      setupInput() {
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') {
            e.preventDefault();
            this.move('left');
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            this.move('right');
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            this.move('up');
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            this.move('down');
          }
        });
        
        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        
        this.gridElement.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        });
        
        this.gridElement.addEventListener('touchend', (e) => {
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          
          const dx = touchEndX - touchStartX;
          const dy = touchEndY - touchStartY;
          
          if (Math.abs(dx) > Math.abs(dy)) {
            // Horizontal swipe
            if (dx > 30) {
              this.move('right');
            } else if (dx < -30) {
              this.move('left');
            }
          } else {
            // Vertical swipe
            if (dy > 30) {
              this.move('down');
            } else if (dy < -30) {
              this.move('up');
            }
          }
        });
      }
      
      reset() {
        this.gameOverOverlay.classList.remove('show');
        this.init();
      }
    }
    
    const game = new Game2048();
    
    document.getElementById('newGameBtn').addEventListener('click', () => {
      game.reset();
    });
  </script>
</body>
</html>
