<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>颜色选择器 - 在线工具</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }
    .tool-container {
      text-align: center;
      padding: 32px 20px;
    }
    .tool-container h1 {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
      letter-spacing: -0.02em;
    }
    .tool-container .subtitle {
      color: #86868b;
      font-size: 19px;
      margin-bottom: 40px;
      font-weight: 400;
      line-height: 1.4;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 980px;
      color: #0071e3;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #0071e3;
      transform: scale(1.05);
    }
    .color-display {
      width: 100%;
      max-width: 400px;
      height: 200px;
      margin: 0 auto 32px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }
    .picker-section {
      max-width: 600px;
      margin: 0 auto 32px;
      text-align: left;
    }
    .picker-section label {
      display: block;
      margin-bottom: 12px;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 17px;
    }
    .color-input-wrapper {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .color-input-wrapper input[type="color"] {
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    .color-input-wrapper input[type="color"]:hover {
      transform: scale(1.05);
    }
    .color-codes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .code-item {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .code-item label {
      display: block;
      color: #86868b;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .code-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .code-value input {
      flex: 1;
      padding: 10px 14px;
      background: #f5f5f7;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      color: #1d1d1f;
      font-size: 15px;
      font-family: 'Monaco', 'Menlo', monospace;
    }
    .copy-btn {
      padding: 8px 16px;
      background: #0071e3;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .copy-btn:hover {
      background: #0077ed;
      transform: scale(1.05);
    }
    .copy-btn:active {
      transform: scale(0.95);
    }
    .palette-section {
      max-width: 600px;
      margin: 40px auto 0;
      padding-top: 32px;
      border-top: 1px solid rgba(0,0,0,0.1);
    }
    .palette-section h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1d1d1f;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .palette-color {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .palette-color:hover {
      transform: scale(1.1);
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 14px 22px;
      background: #1d1d1f;
      color: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      font-size: 15px;
      font-weight: 500;
    }
    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="notification" class="notification"></div>
  <a href="index.html" class="back-btn">← 返回首页</a>
  
  <main class="container tool-container">
    <h1>🎨 颜色选择器</h1>
    <p class="subtitle">选择颜色并获取各种格式的颜色代码，生成配色方案</p>
    
    <div class="color-display" id="colorDisplay"></div>
    
    <div class="picker-section">
      <label>选择颜色：</label>
      <div class="color-input-wrapper">
        <input type="color" id="colorPicker" value="#0071e3" />
        <input type="text" id="hexInput" value="#0071e3" placeholder="#000000" style="flex: 1; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px;" />
      </div>
    </div>
    
    <div class="color-codes">
      <div class="code-item">
        <label>HEX</label>
        <div class="code-value">
          <input type="text" id="hexCode" readonly />
          <button class="copy-btn" onclick="copyToClipboard('hexCode')">复制</button>
        </div>
      </div>
      
      <div class="code-item">
        <label>RGB</label>
        <div class="code-value">
          <input type="text" id="rgbCode" readonly />
          <button class="copy-btn" onclick="copyToClipboard('rgbCode')">复制</button>
        </div>
      </div>
      
      <div class="code-item">
        <label>HSL</label>
        <div class="code-value">
          <input type="text" id="hslCode" readonly />
          <button class="copy-btn" onclick="copyToClipboard('hslCode')">复制</button>
        </div>
      </div>
    </div>
    
    <div class="palette-section">
      <h2>配色方案</h2>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>
  </main>
  
  <script>
    const colorPicker = document.getElementById('colorPicker');
    const hexInput = document.getElementById('hexInput');
    const colorDisplay = document.getElementById('colorDisplay');
    const hexCode = document.getElementById('hexCode');
    const rgbCode = document.getElementById('rgbCode');
    const hslCode = document.getElementById('hslCode');
    const paletteGrid = document.getElementById('paletteGrid');
    const notificationEl = document.getElementById('notification');
    
    function showNotification(message) {
      notificationEl.textContent = message;
      notificationEl.classList.add('show');
      setTimeout(() => {
        notificationEl.classList.remove('show');
      }, 2000);
    }
    
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }
    
    function rgbToHsl(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }
    
    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      
      if (0 <= h && h < 60) {
        r = c; g = x; b = 0;
      } else if (60 <= h && h < 120) {
        r = x; g = c; b = 0;
      } else if (120 <= h && h < 180) {
        r = 0; g = c; b = x;
      } else if (180 <= h && h < 240) {
        r = 0; g = x; b = c;
      } else if (240 <= h && h < 300) {
        r = x; g = 0; b = c;
      } else if (300 <= h && h < 360) {
        r = c; g = 0; b = x;
      }
      
      r = Math.round((r + m) * 255);
      g = Math.round((g + m) * 255);
      b = Math.round((b + m) * 255);
      
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    
    function updateColor(hex) {
      if (!/^#[0-9A-F]{6}$/i.test(hex)) return;
      
      colorDisplay.style.backgroundColor = hex;
      hexCode.value = hex;
      
      const rgb = hexToRgb(hex);
      if (rgb) {
        rgbCode.value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        
        const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
        hslCode.value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
        
        generatePalette(hsl);
      }
    }
    
    function generatePalette(hsl) {
      paletteGrid.innerHTML = '';
      
      // Generate 5 harmonious colors
      const variations = [
        { h: hsl.h, s: hsl.s, l: hsl.l }, // Original
        { h: (hsl.h + 30) % 360, s: hsl.s, l: hsl.l }, // Analogous
        { h: (hsl.h + 180) % 360, s: hsl.s, l: hsl.l }, // Complementary
        { h: hsl.h, s: Math.min(100, hsl.s + 20), l: Math.max(10, hsl.l - 20) }, // Darker
        { h: hsl.h, s: Math.max(0, hsl.s - 20), l: Math.min(90, hsl.l + 20) }, // Lighter
      ];
      
      variations.forEach(v => {
        const hex = hslToHex(v.h, v.s, v.l);
        const div = document.createElement('div');
        div.className = 'palette-color';
        div.style.backgroundColor = hex;
        div.title = hex;
        div.onclick = () => {
          colorPicker.value = hex;
          hexInput.value = hex;
          updateColor(hex);
          showNotification('已应用配色');
        };
        paletteGrid.appendChild(div);
      });
    }
    
    function copyToClipboard(elementId) {
      const input = document.getElementById(elementId);
      input.select();
      document.execCommand('copy');
      showNotification('已复制到剪贴板！');
    }
    
    colorPicker.addEventListener('input', (e) => {
      hexInput.value = e.target.value;
      updateColor(e.target.value);
    });
    
    hexInput.addEventListener('input', (e) => {
      const hex = e.target.value;
      if (/^#[0-9A-F]{6}$/i.test(hex)) {
        colorPicker.value = hex;
        updateColor(hex);
      }
    });
    
    // Initialize
    updateColor(colorPicker.value);
  </script>
</body>
</html>
