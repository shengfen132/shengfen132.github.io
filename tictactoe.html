<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>五子棋 - 游戏中心</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .tictactoe-container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      gap: 2px;
      margin: 24px auto;
      max-width: 600px;
      aspect-ratio: 1;
    }
    .cell {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid var(--glass);
      border-radius: 4px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      width: 100%;
      aspect-ratio: 1;
    }
    .cell:hover:not(.taken) {
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
      border-color: rgba(34, 197, 94, 0.3);
      transform: scale(1.05);
    }
    .cell.taken {
      cursor: not-allowed;
    }
    .cell.x {
      color: #22c55e;
    }
    .cell.o {
      color: #3b82f6;
    }
    .cell.winner {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
      animation: pulse 0.5s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .game-info {
      margin: 20px 0;
      font-size: 20px;
      font-weight: 600;
    }
    .player-x { color: #22c55e; }
    .player-o { color: #3b82f6; }
    .controls {
      margin: 24px 0;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="tictactoe-container">
      <a href="index.html" class="back-link">🏠 返回游戏中心</a>
      <h1>⚫ 五子棋</h1>
      
      <div class="game-info" id="gameInfo">
        <span class="player-x">黑方</span> 的回合
      </div>
      
      <div class="game-board" id="gameBoard"></div>
      
      <div class="controls">
        <button id="restartBtn">重新开始</button>
      </div>
      
      <p class="hint">黑方和白方轮流落子，先连成五个的获胜！</p>
    </div>
  </main>
  
  <script>
    const BOARD_SIZE = 15;
    const board = Array(BOARD_SIZE * BOARD_SIZE).fill('');
    let currentPlayer = 'X';
    let gameActive = true;
    
    const gameBoard = document.getElementById('gameBoard');
    const gameInfo = document.getElementById('gameInfo');
    const restartBtn = document.getElementById('restartBtn');
    
    // Create board cells
    for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.index = i;
      cell.addEventListener('click', handleCellClick);
      gameBoard.appendChild(cell);
    }
    
    const cells = document.querySelectorAll('.cell');
    
    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.dataset.index);
      
      if (board[index] !== '' || !gameActive) {
        return;
      }
      
      board[index] = currentPlayer;
      cell.textContent = currentPlayer === 'X' ? '⚫' : '⚪';
      cell.classList.add('taken', currentPlayer.toLowerCase());
      
      checkResult();
    }
    
    function checkResult() {
      const winningCells = checkWinner();
      
      if (winningCells.length > 0) {
        gameActive = false;
        const playerClass = currentPlayer === 'X' ? 'player-x' : 'player-o';
        const playerName = currentPlayer === 'X' ? '黑方' : '白方';
        gameInfo.innerHTML = `<span class="${playerClass}">${playerName}</span> 获胜！🎉`;
        
        // Highlight winning cells
        winningCells.forEach(index => {
          cells[index].classList.add('winner');
        });
        return;
      }
      
      if (!board.includes('')) {
        gameActive = false;
        gameInfo.textContent = '平局！🤝';
        return;
      }
      
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      const playerClass = currentPlayer === 'X' ? 'player-x' : 'player-o';
      const playerName = currentPlayer === 'X' ? '黑方' : '白方';
      gameInfo.innerHTML = `<span class="${playerClass}">${playerName}</span> 的回合`;
    }
    
    function checkWinner() {
      // Check all directions: horizontal, vertical, diagonal (both ways)
      const directions = [
        [0, 1],   // horizontal
        [1, 0],   // vertical
        [1, 1],   // diagonal \
        [1, -1]   // diagonal /
      ];
      
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const index = row * BOARD_SIZE + col;
          if (board[index] === '') continue;
          
          for (const [dr, dc] of directions) {
            const cells = [];
            for (let i = 0; i < 5; i++) {
              const r = row + dr * i;
              const c = col + dc * i;
              if (r < 0 || r >= BOARD_SIZE || c < 0 || c >= BOARD_SIZE) break;
              const idx = r * BOARD_SIZE + c;
              if (board[idx] !== board[index]) break;
              cells.push(idx);
            }
            if (cells.length === 5) {
              return cells;
            }
          }
        }
      }
      return [];
    }
    
    function restartGame() {
      board.fill('');
      currentPlayer = 'X';
      gameActive = true;
      gameInfo.innerHTML = '<span class="player-x">黑方</span> 的回合';
      
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('taken', 'x', 'o', 'winner');
      });
    }
    
    restartBtn.addEventListener('click', restartGame);
  </script>
</body>
</html>
