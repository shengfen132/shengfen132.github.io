<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>游戏中心 - 在线小游戏平台</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-portal {
      text-align: center;
      padding: 40px 20px;
    }
    .game-portal h1 {
      font-size: 42px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .game-portal .subtitle {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 40px;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .game-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid var(--glass);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .game-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .game-card h2 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: #e6eef6;
    }
    .game-card p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .game-status {
      margin-top: 12px;
      padding: 4px 12px;
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .coming-soon {
      background: rgba(148, 163, 184, 0.1);
      color: var(--muted);
    }
    .game-card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="container game-portal">
    <h1>🎮 游戏中心</h1>
    <p class="subtitle">欢迎来到在线小游戏平台，选择你喜欢的游戏开始玩吧！</p>
    
    <div class="game-grid">
      <a href="snake.html" class="game-card">
        <div class="game-icon">🐍</div>
        <h2>贪吃蛇</h2>
        <p>经典贪吃蛇游戏，含道具系统和关卡系统。支持键盘、触摸和倾斜控制。</p>
        <span class="game-status">可玩</span>
      </a>
      
      <a href="tictactoe.html" class="game-card">
        <div class="game-icon">⚫</div>
        <h2>五子棋</h2>
        <p>经典五子棋游戏，支持双人对战。先连成五个的获胜！</p>
        <span class="game-status">可玩</span>
      </a>
      
      <a href="memory.html" class="game-card">
        <div class="game-icon">🃏</div>
        <h2>记忆翻牌</h2>
        <p>考验你的记忆力，找出所有配对的卡牌。</p>
        <span class="game-status">可玩</span>
      </a>
      
      <a href="breakout.html" class="game-card">
        <div class="game-icon">🎯</div>
        <h2>打砖块</h2>
        <p>经典打砖块游戏，控制挡板击碎所有砖块。</p>
        <span class="game-status">可玩</span>
      </a>
      
      <a href="2048.html" class="game-card">
        <div class="game-icon">🎲</div>
        <h2>2048</h2>
        <p>数字合并益智游戏，挑战你的逻辑思维。</p>
        <span class="game-status">可玩</span>
      </a>
      
      <a href="spaceshooter.html" class="game-card">
        <div class="game-icon">🚀</div>
        <h2>太空射击</h2>
        <p>驾驶飞船击败敌人，体验刺激的太空冒险。</p>
        <span class="game-status">可玩</span>
      </a>
    </div>
    
    <p class="hint" style="margin-top: 40px;">更多游戏持续添加中...</p>
  </main>
</body>
</html>
