<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>二维码生成器 - 在线工具</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }
    .tool-container {
      text-align: center;
      padding: 32px 20px;
    }
    .tool-container h1 {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
      letter-spacing: -0.02em;
    }
    .tool-container .subtitle {
      color: #86868b;
      font-size: 19px;
      margin-bottom: 40px;
      font-weight: 400;
      line-height: 1.4;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 980px;
      color: #0071e3;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #0071e3;
      transform: scale(1.05);
    }
    .input-section {
      max-width: 600px;
      margin: 0 auto 32px;
      text-align: left;
    }
    .input-section label {
      display: block;
      margin-bottom: 8px;
      color: #1d1d1f;
      font-weight: 600;
      font-size: 17px;
    }
    .input-section textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      color: #1d1d1f;
      font-size: 17px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      resize: vertical;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .input-section textarea:focus {
      outline: none;
      border-color: #0071e3;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
    }
    .controls-section {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 32px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }
    .control-group label {
      color: #86868b;
      font-size: 14px;
      font-weight: 500;
    }
    .control-group select,
    .control-group input[type="color"] {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      color: #1d1d1f;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .control-group select:focus {
      outline: none;
      border-color: #0071e3;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 40px;
    }
    .action-buttons button {
      padding: 12px 28px;
      background: #0071e3;
      border: none;
      border-radius: 980px;
      color: white;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: -0.01em;
    }
    .action-buttons button:hover {
      background: #0077ed;
      transform: scale(1.02);
    }
    .action-buttons button:active {
      transform: scale(0.98);
    }
    .qrcode-container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    #qrcode canvas {
      border-radius: 12px;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 14px 22px;
      background: #1d1d1f;
      color: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      font-size: 15px;
      font-weight: 500;
    }
    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="notification" class="notification"></div>
  <a href="index.html" class="back-btn">← 返回首页</a>
  
  <main class="container tool-container">
    <h1>📱 二维码生成器</h1>
    <p class="subtitle">输入文本、网址或其他内容，生成二维码并下载</p>
    
    <div class="input-section">
      <label for="textInput">输入内容：</label>
      <textarea id="textInput" placeholder="输入文字、网址、联系方式等..."></textarea>
    </div>
    
    <div class="controls-section">
      <div class="control-group">
        <label for="sizeSelect">二维码大小：</label>
        <select id="sizeSelect">
          <option value="128">小 (128x128)</option>
          <option value="256" selected>中 (256x256)</option>
          <option value="512">大 (512x512)</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="colorInput">前景颜色：</label>
        <input type="color" id="colorInput" value="#000000" />
      </div>
      
      <div class="control-group">
        <label for="bgColorInput">背景颜色：</label>
        <input type="color" id="bgColorInput" value="#ffffff" />
      </div>
    </div>
    
    <div class="action-buttons">
      <button id="generateBtn">生成二维码</button>
      <button id="downloadBtn" style="background: #f5f5f7; color: #1d1d1f; border: 1px solid #d2d2d7;">下载图片</button>
    </div>
    
    <div class="qrcode-container">
      <div id="qrcode"></div>
    </div>
  </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const textInput = document.getElementById('textInput');
    const sizeSelect = document.getElementById('sizeSelect');
    const colorInput = document.getElementById('colorInput');
    const bgColorInput = document.getElementById('bgColorInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const notificationEl = document.getElementById('notification');
    
    let qrcode = null;
    
    function showNotification(message) {
      notificationEl.textContent = message;
      notificationEl.classList.add('show');
      setTimeout(() => {
        notificationEl.classList.remove('show');
      }, 2000);
    }
    
    function generateQRCode() {
      const text = textInput.value.trim();
      if (!text) {
        showNotification('请输入要生成二维码的内容！');
        return;
      }
      
      const size = parseInt(sizeSelect.value);
      const color = colorInput.value;
      const bgColor = bgColorInput.value;
      
      // Clear previous QR code
      qrcodeDiv.innerHTML = '';
      
      // Generate new QR code
      qrcode = new QRCode(qrcodeDiv, {
        text: text,
        width: size,
        height: size,
        colorDark: color,
        colorLight: bgColor,
        correctLevel: QRCode.CorrectLevel.H
      });
      
      showNotification('二维码生成成功！');
    }
    
    function downloadQRCode() {
      const canvas = qrcodeDiv.querySelector('canvas');
      if (!canvas) {
        showNotification('请先生成二维码！');
        return;
      }
      
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      showNotification('二维码已下载！');
    }
    
    generateBtn.addEventListener('click', generateQRCode);
    downloadBtn.addEventListener('click', downloadQRCode);
    
    // Auto-generate on Enter (with Ctrl/Cmd)
    textInput.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        generateQRCode();
      }
    });
  </script>
</body>
</html>
