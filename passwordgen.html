<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>密码生成器 - 在线工具</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }
    .tool-container {
      text-align: center;
      padding: 32px 20px;
    }
    .tool-container h1 {
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1d1d1f;
      letter-spacing: -0.02em;
    }
    .tool-container .subtitle {
      color: #86868b;
      font-size: 19px;
      margin-bottom: 40px;
      font-weight: 400;
      line-height: 1.4;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 980px;
      color: #0071e3;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 14px;
      backdrop-filter: blur(10px);
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #0071e3;
      transform: scale(1.05);
    }
    .password-display {
      max-width: 600px;
      margin: 0 auto 32px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .password-text {
      font-size: 24px;
      font-weight: 600;
      color: #0071e3;
      font-family: 'Monaco', 'Menlo', monospace;
      word-break: break-all;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .strength-indicator {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }
    .strength-bar {
      flex: 1;
      height: 6px;
      background: #e5e5e7;
      border-radius: 3px;
      transition: background 0.3s ease;
    }
    .strength-bar.active {
      background: #34c759;
    }
    .strength-bar.active.weak {
      background: #ff3b30;
    }
    .strength-bar.active.medium {
      background: #ff9500;
    }
    .strength-label {
      color: #86868b;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .action-buttons button {
      padding: 12px 28px;
      border: none;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: -0.01em;
    }
    .btn-primary {
      background: #0071e3;
      color: white;
    }
    .btn-primary:hover {
      background: #0077ed;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: #1d1d1f;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .btn-secondary:hover {
      background: white;
      transform: scale(1.02);
    }
    .options-section {
      max-width: 600px;
      margin: 40px auto 0;
      padding: 24px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      text-align: left;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .options-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1d1d1f;
      text-align: center;
    }
    .option-group {
      margin-bottom: 20px;
    }
    .option-group label {
      display: block;
      color: #1d1d1f;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .option-group input[type="range"] {
      width: 100%;
      margin-bottom: 8px;
    }
    .range-value {
      text-align: center;
      color: #0071e3;
      font-size: 24px;
      font-weight: 600;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f5f5f7;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .checkbox-item:hover {
      background: #e8e8ed;
    }
    .checkbox-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .checkbox-item label {
      flex: 1;
      cursor: pointer;
      margin: 0;
      font-weight: 500;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 14px 22px;
      background: #1d1d1f;
      color: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      font-size: 15px;
      font-weight: 500;
    }
    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="notification" class="notification"></div>
  <a href="index.html" class="back-btn">← 返回首页</a>
  
  <main class="container tool-container">
    <h1>🔐 密码生成器</h1>
    <p class="subtitle">生成强随机密码，保护您的账户安全</p>
    
    <div class="password-display">
      <div class="password-text" id="passwordText">点击生成密码</div>
      <div class="strength-indicator">
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
        <div class="strength-bar"></div>
      </div>
      <div class="strength-label" id="strengthLabel">密码强度：未生成</div>
      <div class="action-buttons">
        <button class="btn-primary" id="generateBtn">生成密码</button>
        <button class="btn-secondary" id="copyBtn">复制</button>
      </div>
    </div>
    
    <div class="options-section">
      <h2>密码选项</h2>
      
      <div class="option-group">
        <label for="lengthRange">密码长度：</label>
        <input type="range" id="lengthRange" min="6" max="32" value="16" />
        <div class="range-value" id="lengthValue">16</div>
      </div>
      
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="includeUppercase" checked />
          <label for="includeUppercase">包含大写字母 (A-Z)</label>
        </div>
        
        <div class="checkbox-item">
          <input type="checkbox" id="includeLowercase" checked />
          <label for="includeLowercase">包含小写字母 (a-z)</label>
        </div>
        
        <div class="checkbox-item">
          <input type="checkbox" id="includeNumbers" checked />
          <label for="includeNumbers">包含数字 (0-9)</label>
        </div>
        
        <div class="checkbox-item">
          <input type="checkbox" id="includeSymbols" checked />
          <label for="includeSymbols">包含符号 (!@#$%^&*)</label>
        </div>
      </div>
    </div>
  </main>
  
  <script>
    const passwordText = document.getElementById('passwordText');
    const strengthLabel = document.getElementById('strengthLabel');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const lengthRange = document.getElementById('lengthRange');
    const lengthValue = document.getElementById('lengthValue');
    const includeUppercase = document.getElementById('includeUppercase');
    const includeLowercase = document.getElementById('includeLowercase');
    const includeNumbers = document.getElementById('includeNumbers');
    const includeSymbols = document.getElementById('includeSymbols');
    const notificationEl = document.getElementById('notification');
    
    const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const lowercase = 'abcdefghijklmnopqrstuvwxyz';
    const numbers = '0123456789';
    const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
    
    function showNotification(message) {
      notificationEl.textContent = message;
      notificationEl.classList.add('show');
      setTimeout(() => {
        notificationEl.classList.remove('show');
      }, 2000);
    }
    
    function generatePassword() {
      const length = parseInt(lengthRange.value);
      let charset = '';
      let password = '';
      
      if (includeUppercase.checked) charset += uppercase;
      if (includeLowercase.checked) charset += lowercase;
      if (includeNumbers.checked) charset += numbers;
      if (includeSymbols.checked) charset += symbols;
      
      if (charset === '') {
        showNotification('请至少选择一种字符类型！');
        return;
      }
      
      for (let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      
      passwordText.textContent = password;
      updateStrength(password);
    }
    
    function updateStrength(password) {
      let strength = 0;
      const bars = document.querySelectorAll('.strength-bar');
      
      if (password.length >= 8) strength++;
      if (password.length >= 12) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;
      
      bars.forEach((bar, index) => {
        bar.classList.remove('active', 'weak', 'medium');
        if (index < strength) {
          bar.classList.add('active');
          if (strength <= 2) bar.classList.add('weak');
          else if (strength <= 3) bar.classList.add('medium');
        }
      });
      
      const labels = ['很弱', '弱', '一般', '强', '很强'];
      strengthLabel.textContent = '密码强度：' + (labels[strength - 1] || '未生成');
    }
    
    function copyPassword() {
      const password = passwordText.textContent;
      if (password === '点击生成密码') {
        showNotification('请先生成密码！');
        return;
      }
      
      navigator.clipboard.writeText(password).then(() => {
        showNotification('密码已复制到剪贴板！');
      }).catch(() => {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = password;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showNotification('密码已复制到剪贴板！');
      });
    }
    
    lengthRange.addEventListener('input', (e) => {
      lengthValue.textContent = e.target.value;
    });
    
    generateBtn.addEventListener('click', generatePassword);
    copyBtn.addEventListener('click', copyPassword);
    
    // Auto-generate on load
    generatePassword();
  </script>
</body>
</html>
