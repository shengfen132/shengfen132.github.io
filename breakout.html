<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>打砖块 - 游戏中心</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .breakout-container {
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }
    .breakout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .stat-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid var(--glass);
      border-radius: 8px;
      padding: 12px 20px;
      min-width: 80px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #22c55e;
    }
    .game-canvas-container {
      position: relative;
      margin: 20px auto;
      max-width: 600px;
    }
    #gameCanvas {
      border: 2px solid var(--glass);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
      display: block;
      margin: 0 auto;
    }
    .controls {
      margin: 24px 0;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      text-decoration: none;
      font-size: 18px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .game-message {
      font-size: 24px;
      font-weight: 700;
      margin: 20px 0;
      min-height: 32px;
    }
    .game-message.win {
      color: #22c55e;
    }
    .game-message.lose {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="breakout-container">
      <a href="index.html" class="back-link">🏠 返回游戏中心</a>
      <h1>🎯 打砖块</h1>
      
      <div class="breakout-header">
        <div class="stat-box">
          <div class="stat-label">分数</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">关卡</div>
          <div class="stat-value" id="level">1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">生命</div>
          <div class="stat-value" id="lives">3</div>
        </div>
      </div>
      
      <div class="game-canvas-container">
        <canvas id="gameCanvas" width="600" height="500"></canvas>
      </div>
      
      <div id="gameMessage" class="game-message"></div>
      
      <div class="controls">
        <button id="startBtn">开始游戏</button>
        <button id="pauseBtn" disabled>暂停</button>
        <button id="restartBtn">重新开始</button>
      </div>
      
      <p class="hint">使用方向键或鼠标移动挡板，击碎所有砖块！支持触摸控制。</p>
    </div>
  </main>
  
  <script>
    class BreakoutGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        // Game state
        this.isPlaying = false;
        this.isPaused = false;
        this.score = 0;
        this.level = 1;
        this.lives = 3;
        
        // Paddle
        this.paddleWidth = 100;
        this.paddleHeight = 12;
        this.paddleX = (this.canvas.width - this.paddleWidth) / 2;
        this.paddleSpeed = 8;
        
        // Ball
        this.ballRadius = 8;
        this.ballX = this.canvas.width / 2;
        this.ballY = this.canvas.height - 40;
        this.ballSpeedX = 4;
        this.ballSpeedY = -4;
        
        // Bricks
        this.brickRowCount = 5;
        this.brickColumnCount = 10;
        this.brickWidth = 50;
        this.brickHeight = 20;
        this.brickPadding = 5;
        this.brickOffsetTop = 50;
        this.brickOffsetLeft = 30;
        this.bricks = [];
        
        // Controls
        this.rightPressed = false;
        this.leftPressed = false;
        this.mouseX = 0;
        this.touchX = 0;
        
        // Elements
        this.scoreElement = document.getElementById('score');
        this.levelElement = document.getElementById('level');
        this.livesElement = document.getElementById('lives');
        this.messageElement = document.getElementById('gameMessage');
        this.startBtn = document.getElementById('startBtn');
        this.pauseBtn = document.getElementById('pauseBtn');
        this.restartBtn = document.getElementById('restartBtn');
        
        this.initBricks();
        this.setupControls();
        this.draw();
      }
      
      initBricks() {
        this.bricks = [];
        const colors = ['#ef4444', '#f97316', '#f59e0b', '#22c55e', '#3b82f6'];
        for (let c = 0; c < this.brickColumnCount; c++) {
          this.bricks[c] = [];
          for (let r = 0; r < this.brickRowCount; r++) {
            this.bricks[c][r] = { 
              x: 0, 
              y: 0, 
              status: 1,
              color: colors[r % colors.length]
            };
          }
        }
      }
      
      setupControls() {
        // Keyboard
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'd') {
            this.rightPressed = true;
          } else if (e.key === 'ArrowLeft' || e.key === 'a') {
            this.leftPressed = true;
          }
        });
        
        document.addEventListener('keyup', (e) => {
          if (e.key === 'ArrowRight' || e.key === 'd') {
            this.rightPressed = false;
          } else if (e.key === 'ArrowLeft' || e.key === 'a') {
            this.leftPressed = false;
          }
        });
        
        // Mouse
        document.addEventListener('mousemove', (e) => {
          const rect = this.canvas.getBoundingClientRect();
          this.mouseX = e.clientX - rect.left;
        });
        
        // Touch
        this.canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const rect = this.canvas.getBoundingClientRect();
          this.touchX = e.touches[0].clientX - rect.left;
        });
        
        // Buttons
        this.startBtn.addEventListener('click', () => this.start());
        this.pauseBtn.addEventListener('click', () => this.togglePause());
        this.restartBtn.addEventListener('click', () => this.restart());
      }
      
      start() {
        if (!this.isPlaying) {
          this.isPlaying = true;
          this.isPaused = false;
          this.startBtn.disabled = true;
          this.pauseBtn.disabled = false;
          this.messageElement.textContent = '';
          this.gameLoop();
        }
      }
      
      togglePause() {
        if (this.isPlaying) {
          this.isPaused = !this.isPaused;
          this.pauseBtn.textContent = this.isPaused ? '继续' : '暂停';
          if (!this.isPaused) {
            this.gameLoop();
          }
        }
      }
      
      restart() {
        this.isPlaying = false;
        this.isPaused = false;
        this.score = 0;
        this.level = 1;
        this.lives = 3;
        this.ballSpeedX = 4;
        this.ballSpeedY = -4;
        this.resetBall();
        this.initBricks();
        this.updateStats();
        this.startBtn.disabled = false;
        this.pauseBtn.disabled = true;
        this.pauseBtn.textContent = '暂停';
        this.messageElement.textContent = '';
        this.draw();
      }
      
      resetBall() {
        this.ballX = this.canvas.width / 2;
        this.ballY = this.canvas.height - 40;
        this.ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * Math.abs(this.ballSpeedX);
      }
      
      gameLoop() {
        if (!this.isPlaying || this.isPaused) return;
        
        this.update();
        this.draw();
        requestAnimationFrame(() => this.gameLoop());
      }
      
      update() {
        // Move ball
        this.ballX += this.ballSpeedX;
        this.ballY += this.ballSpeedY;
        
        // Ball collision with walls
        if (this.ballX + this.ballRadius > this.canvas.width || this.ballX - this.ballRadius < 0) {
          this.ballSpeedX = -this.ballSpeedX;
        }
        if (this.ballY - this.ballRadius < 0) {
          this.ballSpeedY = -this.ballSpeedY;
        }
        
        // Ball collision with paddle
        if (this.ballY + this.ballRadius > this.canvas.height - this.paddleHeight) {
          if (this.ballX > this.paddleX && this.ballX < this.paddleX + this.paddleWidth) {
            // Add spin based on where ball hits paddle
            const hitPos = (this.ballX - this.paddleX) / this.paddleWidth;
            this.ballSpeedX = (hitPos - 0.5) * 8;
            this.ballSpeedY = -Math.abs(this.ballSpeedY);
          }
        }
        
        // Ball falls below paddle
        if (this.ballY + this.ballRadius > this.canvas.height) {
          this.lives--;
          this.updateStats();
          if (this.lives <= 0) {
            this.gameOver(false);
          } else {
            this.resetBall();
          }
        }
        
        // Move paddle
        if (this.rightPressed && this.paddleX < this.canvas.width - this.paddleWidth) {
          this.paddleX += this.paddleSpeed;
        } else if (this.leftPressed && this.paddleX > 0) {
          this.paddleX -= this.paddleSpeed;
        }
        
        // Mouse/touch control
        const targetX = this.touchX || this.mouseX;
        if (targetX > 0) {
          const newPaddleX = targetX - this.paddleWidth / 2;
          if (newPaddleX >= 0 && newPaddleX <= this.canvas.width - this.paddleWidth) {
            this.paddleX = newPaddleX;
          }
        }
        
        // Brick collision
        this.checkBrickCollision();
      }
      
      checkBrickCollision() {
        let allBricksCleared = true;
        
        for (let c = 0; c < this.brickColumnCount; c++) {
          for (let r = 0; r < this.brickRowCount; r++) {
            const brick = this.bricks[c][r];
            if (brick.status === 1) {
              allBricksCleared = false;
              const brickX = c * (this.brickWidth + this.brickPadding) + this.brickOffsetLeft;
              const brickY = r * (this.brickHeight + this.brickPadding) + this.brickOffsetTop;
              
              if (this.ballX + this.ballRadius > brickX &&
                  this.ballX - this.ballRadius < brickX + this.brickWidth &&
                  this.ballY + this.ballRadius > brickY &&
                  this.ballY - this.ballRadius < brickY + this.brickHeight) {
                this.ballSpeedY = -this.ballSpeedY;
                brick.status = 0;
                this.score += 10;
                this.updateStats();
              }
            }
          }
        }
        
        if (allBricksCleared) {
          this.nextLevel();
        }
      }
      
      nextLevel() {
        this.level++;
        this.ballSpeedX *= 1.1;
        this.ballSpeedY *= 1.1;
        this.resetBall();
        this.initBricks();
        this.updateStats();
      }
      
      gameOver(won) {
        this.isPlaying = false;
        this.startBtn.disabled = false;
        this.pauseBtn.disabled = true;
        
        if (won) {
          this.messageElement.textContent = `🎉 恭喜过关！分数: ${this.score}`;
          this.messageElement.className = 'game-message win';
        } else {
          this.messageElement.textContent = `💥 游戏结束！分数: ${this.score}`;
          this.messageElement.className = 'game-message lose';
        }
      }
      
      updateStats() {
        this.scoreElement.textContent = this.score;
        this.levelElement.textContent = this.level;
        this.livesElement.textContent = this.lives;
      }
      
      draw() {
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Draw bricks
        for (let c = 0; c < this.brickColumnCount; c++) {
          for (let r = 0; r < this.brickRowCount; r++) {
            const brick = this.bricks[c][r];
            if (brick.status === 1) {
              const brickX = c * (this.brickWidth + this.brickPadding) + this.brickOffsetLeft;
              const brickY = r * (this.brickHeight + this.brickPadding) + this.brickOffsetTop;
              brick.x = brickX;
              brick.y = brickY;
              
              this.ctx.fillStyle = brick.color;
              this.ctx.fillRect(brickX, brickY, this.brickWidth, this.brickHeight);
              this.ctx.strokeStyle = 'rgba(255,255,255,0.3)';
              this.ctx.strokeRect(brickX, brickY, this.brickWidth, this.brickHeight);
            }
          }
        }
        
        // Draw ball
        this.ctx.beginPath();
        this.ctx.arc(this.ballX, this.ballY, this.ballRadius, 0, Math.PI * 2);
        this.ctx.fillStyle = '#22c55e';
        this.ctx.fill();
        this.ctx.closePath();
        
        // Draw paddle
        this.ctx.fillStyle = '#3b82f6';
        this.ctx.fillRect(this.paddleX, this.canvas.height - this.paddleHeight, this.paddleWidth, this.paddleHeight);
      }
    }
    
    const game = new BreakoutGame();
  </script>
</body>
</html>
